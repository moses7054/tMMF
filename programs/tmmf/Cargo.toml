[package]
name = "tmmf"
version = "0.1.0"
description = "Teaching tokenized money market fund"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "tmmf"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed", "event-cpi"] }
anchor-spl = "1.2.0"
pyth-solana-receiver-sdk = "2.0.0"
solana-account = "4.3.0"

[dev-dependencies]
litesvm = "0.16.0"
litesvm-token = { version = "0.16.0", features = ["token-2022"] }
solana-message = { version = "4.4.1", features = ["wincode"] }
solana-transaction = { version = "4.1.6", features = ["verify"] }
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "4.1.0"
pyth-solana-receiver-sdk = "2.0.0"
solana-account = "4.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
